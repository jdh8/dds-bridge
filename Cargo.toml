[package]
name = "dds-bridge"
version = "0.20.1"
authors = ["Chen-Pang He (https://jdh8.org)"]
edition = "2024"
rust-version = "1.93"
description = "Rusty API for DDS, the double dummy solver for bridge"
repository = "https://github.com/jdh8/dds-bridge"
homepage = "https://github.com/jdh8/dds-bridge"
documentation = "https://docs.rs/dds-bridge"
readme = "README.md"
license = "Apache-2.0"
categories = ["game-development"]
keywords = ["bridge", "double-dummy"]

[features]
serde = ["dep:serde", "dep:serde_with", "arrayvec/serde", "bitflags/serde", "contract-bridge/serde", "semver/serde"]

[dependencies]
arrayvec = "0.7"
bitflags = "2"
contract-bridge = "0.1"
dds-bridge-sys = "3.1"
rayon = "1"
semver = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_with = { version = "3", default-features = false, features = ["macros"], optional = true }
thiserror = "2"

[dev-dependencies]
anyhow = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
rand = "0.10"

[profile.dev]
opt-level = 2

[[bench]]
name = "batch_solver"
harness = false

[patch.crates-io]
contract-bridge = { path = "../contract-bridge" }
dds-bridge-sys = { path = "../dds-bridge-sys" }
